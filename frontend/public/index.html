<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nexus Chat</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%233200e8'/><path d='M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z' fill='%23ffffff'/></svg>" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "var(--color-surface, #fcf8ff)",
                        "on-surface": "var(--color-on-surface, #1b1b24)",
                        "surface-container-lowest": "var(--color-surface-container-lowest, #ffffff)",
                        "surface-container-low": "var(--color-surface-container-low, #f5f2ff)",
                        "surface-container": "var(--color-surface-container, #efecfa)",
                        "surface-container-high": "var(--color-surface-container-high, #e9e6f4)",
                        "surface-container-highest": "var(--color-surface-container-highest, #e4e1ee)",
                        "surface-variant": "var(--color-surface-variant, #e4e1ee)",
                        "on-surface-variant": "var(--color-on-surface-variant, #464557)",
                        "primary": "var(--color-primary, #3200e8)",
                        "on-primary": "var(--color-on-primary, #ffffff)",
                        "primary-container": "var(--color-primary-container, #e3dfff)",
                        "on-primary-container": "var(--color-on-primary-container, #110068)",
                        "outline-variant": "var(--color-outline-variant, #c7c4da)",
                        "error": "var(--color-error, #ba1a1a)",
                        "secondary-container": "var(--color-secondary-container, #cce5ff)",
                        "on-secondary-container": "var(--color-on-secondary-container, #001e31)"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "margin-lg": "32px",
                        "max-width-chat": "800px",
                        "margin-md": "20px",
                        "margin-sm": "12px",
                        "margin-xs": "8px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Outfit"],
                        "headline-md": ["Outfit"],
                        "headline-lg": ["Outfit"],
                        "body-lg": ["Outfit"],
                        "label-md": ["Outfit"],
                        "body-md": ["Outfit"],
                        "label-sm": ["Outfit"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}]
                    },
                    "animation": {
                        "slide-up-fade": "slideUpFade 0.4s ease-out forwards",
                        "pulse-subtle": "pulseSubtle 2s infinite"
                    },
                    "keyframes": {
                        "slideUpFade": {
                            "0%": { opacity: "0", transform: "translateY(10px)" },
                            "100%": { opacity: "1", transform: "translateY(0)" }
                        },
                        "pulseSubtle": {
                            "0%, 100%": { backgroundColor: "rgba(77, 56, 255, 0.05)" },
                            "50%": { backgroundColor: "rgba(77, 56, 255, 0.15)" }
                        }
                    }
                },
            },
        }
  </script>
      <script src="/runtime-config.js"></script>
  <style>
      .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #e4e1ee; border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: #302f3a; }

      .dark {
        --color-surface: #0B0F19;
        --color-on-surface: #F8FAFC;
        --color-surface-container-lowest: #111827;
        --color-surface-container-low: #0F172A;
        --color-surface-container: #1E293B;
        --color-surface-container-high: #1E293B;
        --color-surface-container-highest: #334155;
        --color-surface-variant: #334155;
        --color-on-surface-variant: #94A3B8;
        --color-primary: #3B82F6;
        --color-on-primary: #FFFFFF;
        --color-primary-container: rgba(59, 130, 246, 0.15);
        --color-on-primary-container: #60A5FA;
        --color-outline-variant: #1E293B;
        --color-error: #EF4444;
        --color-secondary-container: #1E293B;
        --color-on-secondary-container: #E2E8F0;
      }


      html, body, aside, main, header, footer, section, div, span, p, h1, h2, input, button {
          transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                      border-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                      color 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                      transform 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                      box-shadow 0.3s ease,
                      width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .message-entry {
          animation: slideUpFade 0.4s ease-out forwards;
      }

      .chat-list-item-active {
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .nav-item:hover .material-symbols-outlined {
          animation: pulseSubtle 2s infinite;
          transform: scale(1.1);
      }
      
      .nav-item {
          transition: all 0.2s ease;
      }
      
      .nav-item:hover {
          transform: translateX(4px);
      }

      .btn-interact:active {
          transform: scale(0.92);
      }
      
      .btn-interact:hover {
          transform: scale(1.05);
      }

      .input-focus-expand {
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .input-focus-expand:focus {
          box-shadow: 0 4px 20px -5px rgba(50, 0, 232, 0.15);
          transform: translateY(-1px);
      }

      /* Sidebar collapse utility */
      .sidebar-collapsed {
          width: 80px !important;
      }
      .sidebar-collapsed .nav-text,
      .sidebar-collapsed .logo-text,
      .sidebar-collapsed .user-details,
      .sidebar-collapsed .btn-text {
          display: none !important;
      }
      .sidebar-collapsed .nav-item,
      .sidebar-collapsed .new-chat-btn {
          justify-content: center;
          padding-left: 0;
          padding-right: 0;
      }
      .sidebar-collapsed .logo-container {
          justify-content: center;
          padding: 0;
      }
  </style>
</head>
<body class="bg-surface text-on-surface font-body-md light">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
